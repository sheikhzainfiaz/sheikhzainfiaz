<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 10" width="1000" height="10">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#BF5AF2"/>
      <stop offset="1" stop-color="#FF375F" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .run{animation:run 3.5s cubic-bezier(.6,0,.4,1) infinite}
    @keyframes run{from{transform:translateX(-260px)}to{transform:translateX(1000px)}}
  </style>
  <rect x="0" y="4.5" width="1000" height="1" fill="#fff" fill-opacity=".08"/>
  <rect class="run" x="0" y="4" width="260" height="2" rx="1" fill="url(#g)" filter="url(#glow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Sheikh Zain Fiaz, iOS and macOS Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04050d"/>
      <stop offset="1" stop-color="#0d0a24"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset=".33" stop-color="#BF5AF2"/>
      <stop offset=".66" stop-color="#FF375F"/>
      <stop offset="1" stop-color="#0A84FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64D2FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#64D2FF" stop-opacity=".12"/>
    </linearGradient>
    <mask id="floorMask"><rect x="0" y="240" width="1000" height="80" fill="url(#fade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
    .rise{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
    .d1{animation-delay:.25s}.d2{animation-delay:.5s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .floor{animation:floor 1.1s linear infinite}
    @keyframes floor{to{transform:translateY(16px)}}
    .scan{animation:scan 6s linear infinite}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(400px)}}
    .orb{animation:drift 14s ease-in-out infinite alternate}
    .o2{animation-duration:18s;animation-direction:alternate-reverse}
    @keyframes drift{to{transform:translate(50px,30px)}}
    .blink{animation:blink 1.4s steps(1) infinite}
    @keyframes blink{50%{opacity:.15}}
    .tw{animation:tw 3s ease-in-out infinite}
    .t2{animation-delay:.8s}.t3{animation-delay:1.6s}.t4{animation-delay:2.2s}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  </style>

  <rect width="1000" height="320" rx="16" fill="url(#bg)"/>

  <!-- glowing orbs -->
  <g filter="url(#blur)" opacity=".55">
    <circle class="orb" cx="170" cy="90" r="95" fill="#0A84FF"/>
    <circle class="orb o2" cx="840" cy="120" r="105" fill="#FF375F"/>
    <circle class="orb" cx="520" cy="40" r="70" fill="#BF5AF2"/>
  </g>

  <!-- stars -->
  <g fill="#fff">
    <circle class="tw" cx="90" cy="90" r="1.2"/><circle class="tw t2" cx="240" cy="60" r="1"/>
    <circle class="tw t3" cx="420" cy="48" r="1.2"/><circle class="tw t4" cx="650" cy="58" r="1"/>
    <circle class="tw t2" cx="760" cy="72" r="1.3"/><circle class="tw" cx="880" cy="104" r="1"/>
    <circle class="tw t3" cx="130" cy="190" r="1"/><circle class="tw t4" cx="905" cy="190" r="1.2"/>
  </g>

  <!-- neon grid floor -->
  <g mask="url(#floorMask)" stroke="#BF5AF2" stroke-opacity=".6" stroke-width="1" fill="none">
    <path d="M500 240L-700 320M500 240L-500 320M500 240L-300 320M500 240L-100 320M500 240L100 320M500 240L300 320M500 240L500 320M500 240L700 320M500 240L900 320M500 240L1100 320M500 240L1300 320M500 240L1500 320M500 240L1700 320"/>
    <path class="floor" d="M0 224H1000M0 240H1000M0 256H1000M0 272H1000M0 288H1000M0 304H1000M0 320H1000"/>
  </g>
  <rect x="0" y="239" width="1000" height="2" fill="url(#shine)" filter="url(#glow)"/>

  <!-- scanning beam -->
  <rect class="scan" x="0" y="-60" width="1000" height="60" fill="url(#scanG)"/>

  <!-- HUD corners -->
  <path d="M24 54V24H54M946 24H976V54M24 266V296H54M976 266V296H946" fill="none" stroke="url(#shine)" stroke-width="2" opacity=".75"/>

  <!-- status labels -->
  <circle class="blink" cx="60" cy="36" r="3.5" fill="#30D158"/>
  <text class="mono" x="70" y="40" font-size="11" letter-spacing="2" fill="#8e8e93">SYSTEM ONLINE</text>
  <text class="mono" x="930" y="40" font-size="11" letter-spacing="2" fill="#8e8e93" text-anchor="end">~/sheikhzainfiaz</text>

  <!-- title -->
  <text class="sans rise" x="500" y="138" text-anchor="middle" font-size="58" font-weight="800" letter-spacing="6" fill="url(#shine)" filter="url(#glow)">SHEIKH ZAIN FIAZ</text>
  <text class="mono rise d1" x="500" y="176" text-anchor="middle" font-size="15" letter-spacing="4" fill="#c7c7cc">iOS &amp; macOS DEVELOPER · UI/UX DESIGNER</text>

  <!-- chips -->
  <g class="rise d2 mono" font-size="11" letter-spacing="1.5">
    <rect x="335" y="196" width="160" height="22" rx="11" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".15"/>
    <circle class="blink" cx="351" cy="207" r="3.5" fill="#30D158"/>
    <text x="362" y="211" fill="#e5e5ea">BUILD SUCCEEDED</text>
    <rect x="507" y="196" width="81" height="22" rx="11" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".15"/>
    <text x="547.5" y="211" fill="#64D2FF" text-anchor="middle">SWIFTUI</text>
    <rect x="600" y="196" width="65" height="22" rx="11" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".15"/>
    <text x="632.5" y="211" fill="#BF5AF2" text-anchor="middle">XCODE</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="macOS Terminal running swift run ZainFiaz">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b24"/><stop offset=".55" stop-color="#25105a"/><stop offset="1" stop-color="#5e1450"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/><stop offset=".5" stop-color="#BF5AF2"/><stop offset="1" stop-color="#FF375F"/>
    </linearGradient>
    <linearGradient id="gPink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF375F"/><stop offset="1" stop-color="#FF9F0A"/></linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A84FF"/><stop offset="1" stop-color="#64D2FF"/></linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9F0A"/><stop offset="1" stop-color="#FF453A"/></linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF453A"/><stop offset="1" stop-color="#C4161C"/></linearGradient>
    <linearGradient id="gGray" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8E8E93"/><stop offset="1" stop-color="#48484A"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".6"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
  </defs>

  <style>
    text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Monaco,Consolas,monospace}
    .ui{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Arial,sans-serif}
    .blob{animation:drift 16s ease-in-out infinite alternate}
    .b2{animation-duration:20s;animation-direction:alternate-reverse}
    .b3{animation-duration:12s}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(70px,-50px)}}
    .win{transform-box:fill-box;transform-origin:center;animation:win .9s cubic-bezier(.2,.8,.2,1) both}
    @keyframes win{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
    .launch{animation:bounce .5s ease-in-out 3}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
    .type{animation:type 16s steps(18,end) infinite}
    @keyframes type{0%,6%{transform:translateX(0)}20%,100%{transform:translateX(153px)}}
    .tcur{animation:tcur 16s linear infinite}
    @keyframes tcur{0%,21%{opacity:1}21.5%,100%{opacity:0}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .prog{transform-box:fill-box;transform-origin:left center;animation:prog 16s cubic-bezier(.45,0,.2,1) infinite}
    @keyframes prog{0%,27%{transform:scaleX(0)}39%,100%{transform:scaleX(1)}}
    .ring{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pulse{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:.75}}

    .a23{animation:a23 16s ease-out infinite}@keyframes a23{0%,23%{opacity:0;transform:translateY(4px)}24.5%,97%{opacity:1;transform:none}98%,100%{opacity:0}}
    .a26{animation:a26 16s ease-out infinite}@keyframes a26{0%,26%{opacity:0;transform:translateY(4px)}27.5%,97%{opacity:1;transform:none}98%,100%{opacity:0}}
    .a40{animation:a40 16s ease-out infinite}@keyframes a40{0%,40%{opacity:0;transform:translateY(4px)}41.5%,97%{opacity:1;transform:none}98%,100%{opacity:0}}
    .a42{animation:a42 16s ease-out infinite}@keyframes a42{0%,42%{opacity:0;transform:translateY(4px)}43.5%,97%{opacity:1;transform:none}98%,100%{opacity:0}}
    .a46{animation:a46 16s ease-out infinite}@keyframes a46{0%,46%{opacity:0;transform:translateY(6px)}48%,97%{opacity:1;transform:none}98%,100%{opacity:0}}
    .a48{animation:a48 16s ease-out infinite}@keyframes a48{0%,48%{opacity:0;transform:translateY(4px)}49.5%,97%{opacity:1;transform:none}98%,100%{opacity:0}}
    .a50{animation:a50 16s ease-out infinite}@keyframes a50{0%,50%{opacity:0;transform:translateY(4px)}51.5%,97%{opacity:1;transform:none}98%,100%{opacity:0}}
    .a52{animation:a52 16s ease-out infinite}@keyframes a52{0%,52%{opacity:0;transform:translateY(4px)}53.5%,97%{opacity:1;transform:none}98%,100%{opacity:0}}
    .a55{animation:a55 16s ease-out infinite}@keyframes a55{0%,55%{opacity:0;transform:translateY(4px)}56.5%,97%{opacity:1;transform:none}98%,100%{opacity:0}}
    .a58{animation:a58 16s ease-out infinite}@keyframes a58{0%,58%{opacity:0;transform:translateY(4px)}59.5%,97%{opacity:1;transform:none}98%,100%{opacity:0}}
    .a61{animation:a61 16s ease-out infinite}@keyframes a61{0%,61%{opacity:0;transform:translateY(4px)}62.5%,97%{opacity:1;transform:none}98%,100%{opacity:0}}
    .a64{animation:a64 16s ease-out infinite}@keyframes a64{0%,64%{opacity:0;transform:translateY(4px)}65.5%,97%{opacity:1;transform:none}98%,100%{opacity:0}}
    .a67{animation:a67 16s ease-out infinite}@keyframes a67{0%,67%{opacity:0;transform:translateY(4px)}68.5%,97%{opacity:1;transform:none}98%,100%{opacity:0}}
    .a71{animation:a71 16s ease-out infinite}@keyframes a71{0%,71%{opacity:0;transform:translateY(4px)}72.5%,97%{opacity:1;transform:none}98%,100%{opacity:0}}
    .a76{animation:a76 16s ease-out infinite}@keyframes a76{0%,76%{opacity:0;transform:translateY(4px)}77.5%,97%{opacity:1;transform:none}98%,100%{opacity:0}}
  </style>

  <!-- wallpaper -->
  <rect width="900" height="560" fill="url(#wall)"/>
  <rect width="900" height="560" fill="url(#grid)"/>
  <g filter="url(#blur)" opacity=".7">
    <circle class="blob" cx="170" cy="420" r="150" fill="#0A84FF"/>
    <circle class="blob b2" cx="760" cy="140" r="170" fill="#BF5AF2"/>
    <circle class="blob b3" cx="620" cy="500" r="120" fill="#FF375F"/>
  </g>

  <!-- menu bar -->
  <rect width="900" height="26" fill="#000" fill-opacity=".35"/>
  <text class="ui" x="18" y="17.5" font-size="12.5" fill="#fff"><tspan font-weight="700">Xcode</tspan><tspan dx="18">File</tspan><tspan dx="16">Edit</tspan><tspan dx="16">View</tspan><tspan dx="16">Find</tspan><tspan dx="16">Navigate</tspan><tspan dx="16">Editor</tspan><tspan dx="16">Product</tspan><tspan dx="16">Debug</tspan><tspan dx="16">Window</tspan><tspan dx="16">Help</tspan></text>
  <rect x="760" y="8" width="20" height="10" rx="3" fill="none" stroke="#fff" stroke-opacity=".9"/>
  <rect x="762" y="10" width="14" height="6" rx="1.5" fill="#fff"/>
  <rect x="781" y="11" width="2" height="4" rx="1" fill="#fff" fill-opacity=".9"/>
  <text class="ui" x="882" y="17.5" font-size="12.5" fill="#fff" text-anchor="end">Tue 9:41 AM</text>

  <!-- terminal window -->
  <g class="win">
    <g filter="url(#shadow)"><rect x="90" y="48" width="720" height="420" rx="12" fill="#141418"/></g>
    <path d="M102 48H798A12 12 0 0 1 810 60V80H90V60A12 12 0 0 1 102 48Z" fill="#232328"/>
    <rect x="90" y="48" width="720" height="420" rx="12" fill="none" stroke="#fff" stroke-opacity=".12"/>
    <rect x="90" y="80" width="720" height="1" fill="#000" fill-opacity=".6"/>
    <circle cx="112" cy="64" r="6" fill="#FF5F57"/>
    <circle cx="132" cy="64" r="6" fill="#FEBC2E"/>
    <circle cx="152" cy="64" r="6" fill="#28C840"/>
    <text class="ui" x="450" y="68" font-size="12" font-weight="600" fill="#9a9aa0" text-anchor="middle">zain — ~/Developer — zsh — 80×24</text>

    <g font-size="14">
      <!-- command being typed -->
      <text x="112" y="108" fill="#30D158" font-weight="700">➜</text>
      <text x="132" y="108" fill="#64D2FF" font-weight="700">~/Developer</text>
      <text x="240" y="108" fill="#e5e5ea">swift run ZainFiaz</text>
      <g class="type">
        <rect class="tcur" x="240" y="95" width="8.5" height="17" fill="#e5e5ea"/>
        <rect x="248.5" y="94" width="170" height="20" fill="#141418"/>
      </g>

      <!-- build output -->
      <text class="a23" x="112" y="132" fill="#8e8e93">Building for debugging...</text>
      <g class="a26">
        <rect x="112" y="147" width="300" height="9" rx="4.5" fill="#2c2c2e"/>
        <rect class="prog" x="112" y="147" width="300" height="9" rx="4.5" fill="url(#brand)"/>
      </g>
      <text class="a40" x="426" y="156" fill="#8e8e93">[3/3] Linking ZainFiaz</text>
      <text class="a42" x="112" y="180" fill="#30D158">✓ Build complete! <tspan fill="#8e8e93">(1.84s)</tspan></text>

      <!-- app icon -->
      <g class="a46">
        <rect class="pulse" x="118" y="226" width="120" height="120" rx="28" fill="url(#brand)" filter="url(#soft)"/>
        <rect x="118" y="226" width="120" height="120" rx="28" fill="url(#brand)"/>
        <rect x="118.5" y="226.5" width="119" height="119" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".35"/>
        <text class="ui" x="178" y="302" font-size="46" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="1">ZF</text>
        <circle class="ring" cx="178" cy="286" r="72" fill="none" stroke="url(#brand)" stroke-width="1.5" stroke-dasharray="4 10"/>
      </g>

      <!-- neofetch-style info -->
      <text class="a48" x="290" y="234" font-weight="700"><tspan fill="#0A84FF">zain</tspan><tspan fill="#e5e5ea">@</tspan><tspan fill="#BF5AF2">MacBook-Pro</tspan></text>
      <rect class="a50" x="290" y="242" width="136" height="2" rx="1" fill="url(#brand)"/>
      <text class="a52" x="290" y="266"><tspan fill="#64D2FF" font-weight="700">Role</tspan><tspan x="375" fill="#e5e5ea">iOS &amp; macOS Developer</tspan></text>
      <text class="a55" x="290" y="288"><tspan fill="#64D2FF" font-weight="700">Stack</tspan><tspan x="375" fill="#e5e5ea">Swift · SwiftUI · UIKit · AppKit</tspan></text>
      <text class="a58" x="290" y="310"><tspan fill="#64D2FF" font-weight="700">Design</tspan><tspan x="375" fill="#e5e5ea">Figma · Adobe XD · Photoshop · Illustrator</tspan></text>
      <text class="a61" x="290" y="332"><tspan fill="#64D2FF" font-weight="700">IDE</tspan><tspan x="375" fill="#e5e5ea">Xcode · iOS Simulator</tspan></text>
      <text class="a64" x="290" y="354"><tspan fill="#64D2FF" font-weight="700">Craft</tspan><tspan x="375" fill="#e5e5ea">UI/UX · Branding · Accessibility</tspan></text>
      <text class="a67" x="290" y="376"><tspan fill="#64D2FF" font-weight="700">YouTube</tspan><tspan x="375" fill="#e5e5ea">M.Z TECH</tspan></text>
      <g class="a71">
        <rect x="290" y="392" width="20" height="16" rx="3" fill="#FF453A"/>
        <rect x="314" y="392" width="20" height="16" rx="3" fill="#FF9F0A"/>
        <rect x="338" y="392" width="20" height="16" rx="3" fill="#FFD60A"/>
        <rect x="362" y="392" width="20" height="16" rx="3" fill="#30D158"/>
        <rect x="386" y="392" width="20" height="16" rx="3" fill="#64D2FF"/>
        <rect x="410" y="392" width="20" height="16" rx="3" fill="#0A84FF"/>
        <rect x="434" y="392" width="20" height="16" rx="3" fill="#BF5AF2"/>
        <rect x="458" y="392" width="20" height="16" rx="3" fill="#FF375F"/>
      </g>

      <!-- final prompt -->
      <g class="a76">
        <text x="112" y="440" fill="#30D158" font-weight="700">➜</text>
        <text x="132" y="440" fill="#64D2FF" font-weight="700">~/Developer</text>
        <rect class="blink" x="240" y="427" width="8.5" height="17" fill="#e5e5ea"/>
      </g>
    </g>
  </g>

  <!-- dock -->
  <rect x="254" y="484" width="392" height="62" rx="18" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".22"/>
  <g class="launch">
    <rect x="266" y="493" width="44" height="44" rx="10" fill="#1c1c1e" stroke="#fff" stroke-opacity=".25"/>
    <text x="288" y="520" font-size="15" font-weight="700" fill="#30D158" text-anchor="middle">&gt;_</text>
  </g>
  <rect x="320" y="493" width="44" height="44" rx="10" fill="url(#brand)"/>
  <text x="342" y="520" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">&lt;/&gt;</text>
  <rect x="374" y="493" width="44" height="44" rx="10" fill="url(#gPink)"/>
  <text class="ui" x="396" y="522" font-size="20" fill="#fff" text-anchor="middle">✦</text>
  <rect x="428" y="493" width="44" height="44" rx="10" fill="url(#gTeal)"/>
  <text x="450" y="520" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">{ }</text>
  <rect x="482" y="493" width="44" height="44" rx="10" fill="url(#gOrange)"/>
  <text class="ui" x="504" y="522" font-size="20" fill="#fff" text-anchor="middle">⌥</text>
  <rect x="536" y="493" width="44" height="44" rx="10" fill="url(#gRed)"/>
  <text class="ui" x="558" y="521" font-size="16" fill="#fff" text-anchor="middle">▶</text>
  <rect x="590" y="493" width="44" height="44" rx="10" fill="url(#gGray)"/>
  <text class="ui" x="612" y="522" font-size="20" fill="#fff" text-anchor="middle">◎</text>
  <circle cx="288" cy="541.5" r="2" fill="#fff" fill-opacity=".85"/>
  <circle cx="342" cy="541.5" r="2" fill="#fff" fill-opacity=".85"/>
</svg>
